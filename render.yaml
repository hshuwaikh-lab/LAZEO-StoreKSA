services:
  - type: web
    name: lazeo-storeksa-api
    env: node
    region: us-east
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lazeo-uploads
      - key: CORS_ORIGIN
        value: https://hshuwaikh-lab.github.io
